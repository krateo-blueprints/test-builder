apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-certificate" $.Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $.Values.certificate.secretName | default (printf "%s-tls" $.Release.Name | trunc 63 | trimSuffix "-") }}
  {{- if $.Values.certificate.commonName }}
  commonName: {{ $.Values.certificate.commonName | quote }}
  {{- end }}
  dnsNames:
    - {{ $.Values.ingress.host | quote }}
    {{- range $.Values.certificate.extraDnsNames }}
    - {{ . | quote }}
    {{- end }}
  duration: {{ $.Values.certificate.duration | quote }}
  renewBefore: {{ $.Values.certificate.renewBefore | quote }}
  privateKey:
    algorithm: {{ $.Values.certificate.privateKey.algorithm | quote }}
    size: {{ $.Values.certificate.privateKey.size }}
  issuerRef:
    name: {{ $.Values.certificate.issuerRef.name | quote }}
    kind: {{ $.Values.certificate.issuerRef.kind | quote }}
    group: {{ $.Values.certificate.issuerRef.group | quote }}
