{{- /* krateo:gate begin — generated from architecture.yaml; edit the descriptor, not this block. */}}
{{- $gate := true -}}
{{- $dep0 := lookup "cert-manager.io/v1" "Certificate" $.Release.Namespace (printf "%s-certificate" $.Release.Name | trunc 63 | trimSuffix "-") -}}
{{- $ok0 := false -}}
{{- range (dig "status" "conditions" (list) $dep0) -}}{{- if and (eq (toString .type) "Ready") (eq (toString .status) "True") -}}{{- $ok0 = true -}}{{- end -}}{{- end -}}
{{- if not $ok0 -}}{{- $gate = false -}}{{- end -}}
{{- if $gate }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-ingress" $.Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ $.Values.ingress.host | quote }}
        {{- range $.Values.certificate.extraDnsNames }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ $.Values.certificate.secretName | default (printf "%s-tls" $.Release.Name | trunc 63 | trimSuffix "-") }}
  rules:
    - host: {{ $.Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path | quote }}
            pathType: {{ $.Values.ingress.pathType | quote }}
            backend:
              service:
                name: {{ $.Values.ingress.backend.serviceName | quote }}
                port:
                  number: {{ $.Values.ingress.backend.servicePort }}
{{- end }}
{{- /* krateo:gate end */}}
